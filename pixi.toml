[workspace]
name = "acpp-fork"
channels = ["https://prefix.dev/jackm97/naga-labs"]
# The target: glibc lives here (not as c_stdlib_version), cuda is the driver.
platforms = [{ name = "naga-linux-64", platform = "linux-64", glibc = "2.28", cuda = "12.9", archspec = "x86_64_v3" }]
preview = ["pixi-build"]
requires-pixi = ">=0.84.1"

[workspace.build-variants]
c_compiler_version = ["14"]
cxx_compiler_version = ["14"]
# pixi does not fill this in; stdlib('c') fails without it.
c_stdlib = ["sysroot"]
# CUDA toolkit version (the driver is __cuda, from the platform entry).
cuda_compiler = ["cuda-nvcc"]
cuda_compiler_version = ["12.9"]
python = ["3.14"]
# Series pins from acpp-toolchain/shared/variants/linux-64.yaml.
zlib = ["1.3"]
zstd = ["1.5"]
libxml2-devel = ["2.15"]
numactl = ["2.0"]
level-zero-devel = ["1.29"]
level-zero = ["1.29"]

[package.build.backend]
name = "pixi-build-rattler-build"
version = ">=0.4.8,<0.5"
channels = ["https://prefix.dev/pixi-build-backends", "https://prefix.dev/conda-forge"]

[package.build.config]
experimental = true

[dependencies]
naga-acpp-local = { path = "." }
nushell = ">=0.106"
# Test suite (naga/tasks/test-*.nu): what CI's suite environments carry for linux-64.
cmake = ">=3.24"
ninja = "*"
libboost-devel = "*"
tbb-devel = "*"
# GNU timeout, so a hung test executable is reported instead of blocking.
coreutils = "*"

[tasks.info]
cmd = "acpp-info -l"
description = "What the installed runtime sees on this machine"

[tasks.check-devices]
cmd = "nu naga/tasks/check-devices.nu"
description = "Fail unless acpp-info -l reports OpenMP, CUDA, OpenCL and Level Zero devices"

[tasks.test-build]
cmd = "nu naga/tasks/test-build.nu"
description = "Build tests/ (rt, sycl, pstl, pcuda) against the installed env into .pixi/naga-tests"

[tasks.test-omp]
cmd = "nu naga/tasks/test-run.nu omp"
depends-on = ["test-build"]
description = "OpenMP: rt_tests, sycl_tests, pstl_tests, pcuda_tests"

[tasks.test-cuda]
cmd = "nu naga/tasks/test-run.nu cuda"
depends-on = ["test-build"]
description = "omp;cuda: sycl_tests"

[tasks.test-ocl]
cmd = "nu naga/tasks/test-run.nu ocl"
depends-on = ["test-build"]
description = "ocl: sycl_tests (Intel Graphics here)"

[tasks.test-ze]
cmd = "nu naga/tasks/test-run.nu ze"
depends-on = ["test-build"]
description = "ze (Level Zero): sycl_tests"

[tasks.test-sanitizers]
cmd = "nu naga/tasks/test-run.nu sanitizers"
description = "Sanitizer smoke: address and thread link, run clean, and fire"

[tasks.test]
cmd = "nu naga/tasks/test-run.nu all"
depends-on = ["test-build"]
description = "Every cell, no stop at first failure; logs under ~/logs/acpp-fork/tests-<timestamp>/"

# [dev] pulls the recipe's build and host closure without building the package.
[feature.dev.dev]
naga-acpp-local = { path = "." }

[feature.dev.dependencies]
nushell = ">=0.106"
git = "*"
ripgrep = "*"
fd-find = "*"
gdb = "*"
rattler-build = ">=0.72"

[feature.git.dependencies]
git = "*"
nushell = "*"

[feature.git.tasks]
setup-git = "git config core.hooksPath .project/hooks"

[environments]
dev = { features = ["dev"], no-default-feature = true }
git = { features = ["git"], no-default-feature = true }
