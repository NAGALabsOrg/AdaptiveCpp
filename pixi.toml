[workspace]
name = "acpp-fork"
channels = ["https://prefix.dev/jackm97/naga-labs"]
# The target: glibc lives here (not as c_stdlib_version), cuda is the driver.
platforms = [{ name = "naga-linux-64", platform = "linux-64", glibc = "2.28", cuda = "12.9", archspec = "x86_64_v3" }]
preview = ["pixi-build"]
requires-pixi = ">=0.84.2"

[workspace.build-variants]
c_compiler_version = ["14"]
cxx_compiler_version = ["14"]
# pixi does not fill this in; stdlib('c') fails without it.
c_stdlib = ["sysroot"]
# CUDA toolkit version (the driver is __cuda, from the platform entry).
cuda_compiler = ["cuda-nvcc"]
cuda_compiler_version = ["12.9"]
python = ["3.14"]
# Series pins from acpp-toolchain/shared/variants/linux-64.yaml.
zlib = ["1.3"]
zstd = ["1.5"]
libxml2-devel = ["2.15"]
numactl = ["2.0"]
level-zero-devel = ["1.29"]
level-zero = ["1.29"]

[workspace.dependencies]
naga-sg-tests = { path = "naga/sg-tests" }
naga-acpp-core = { path = "packages/core" }
naga-acpp-llvm = { path = "packages/extras/mutex" }
naga-acpp-runtime-cuda = { path = "packages/extras/runtime-cuda" }
naga-acpp-runtime-level-zero = { path = "packages/extras/runtime-level-zero" }
naga-acpp-runtime-ocl = { path = "packages/extras/runtime-ocl" }
naga-acpp-runtime-rocm = { path = "packages/extras/runtime-rocm" }
naga-acpp-clangxx_linux-64 = { path = "packages/activations/clangxx" }
naga-acpp = { path = "packages/slices/naga-acpp" }
naga-acpp-llvm-dev = { path = "packages/slices/llvm-dev" }
naga-acpp-check-consumer = { path = "packages/checks/consumer" }

# The toolchain meta package: the six slices. Not the activations, not the vendor packages.
[package]
name = "naga-acpp-toolchain"
version = "0.dev0"
description = "AdaptiveCpp SYCL toolchain (LLVM 23, generic SSCP): compiler, runtime, compiler-rt, LLVM development files, tools, lldb"
homepage = "https://github.com/NAGALabsOrg/AdaptiveCpp"
license = "Apache-2.0 WITH LLVM-exception"
publish = true

[package.build]
backend = { name = "pixi-build-naga", version = "*" }

[package.run-dependencies]
naga-acpp-runtime = { path = "packages/slices/runtime", version = "==0.dev0" }
naga-acpp = { path = "packages/slices/naga-acpp", version = "==0.dev0" }
naga-acpp-compiler-rt = { path = "packages/slices/compiler-rt", version = "==0.dev0" }
naga-acpp-llvm-dev = { path = "packages/slices/llvm-dev", version = "==0.dev0" }
naga-acpp-tools = { path = "packages/slices/tools", version = "==0.dev0" }
naga-acpp-lldb = { path = "packages/slices/lldb", version = "==0.dev0" }

[dependencies]
naga-acpp-toolchain = { path = "." }
naga-acpp-runtime-cuda = { workspace = true }
naga-acpp-runtime-level-zero = { workspace = true }
naga-acpp-runtime-ocl = { workspace = true }
naga-acpp-runtime-rocm = { workspace = true }
nushell = ">=0.106"
# Test suite (naga/tasks/test-*.nu): what CI's suite environments carry for linux-64.
cmake = ">=3.24"
ninja = "*"
libboost-devel = "*"
tbb-devel = "*"
# GNU timeout, so a hung test executable is reported instead of blocking.
coreutils = "*"

[tasks.info]
cmd = "acpp-info -l"
description = "What the installed runtime sees on this machine"

[tasks.check-devices]
cmd = "nu naga/tasks/check-devices.nu"
description = "Fail unless acpp-info -l reports OpenMP, CUDA, OpenCL and Level Zero devices"

[tasks.test-build]
cmd = "nu naga/tasks/test-build.nu"
description = "Build tests/ (rt, sycl, pstl, pcuda) against the installed env into .pixi/naga-tests"

[tasks.test-omp]
cmd = "nu naga/tasks/test-run.nu omp"
depends-on = ["test-build"]
description = "OpenMP: rt_tests, sycl_tests, pstl_tests, pcuda_tests"

[tasks.test-cuda]
cmd = "nu naga/tasks/test-run.nu cuda"
depends-on = ["test-build"]
description = "omp;cuda: sycl_tests"

[tasks.test-ocl]
cmd = "nu naga/tasks/test-run.nu ocl"
depends-on = ["test-build"]
description = "ocl: sycl_tests (Intel Graphics here)"

[tasks.test-ze]
cmd = "nu naga/tasks/test-run.nu ze"
depends-on = ["test-build"]
description = "ze (Level Zero): sycl_tests"

[tasks.test-sanitizers]
cmd = "nu naga/tasks/test-run.nu sanitizers"
description = "Sanitizer smoke: address and thread link, run clean, and fire"

[tasks.test]
cmd = "nu naga/tasks/test-run.nu all"
depends-on = ["test-build"]
description = "Every cell, no stop at first failure; logs under ~/logs/acpp-fork/tests-<timestamp>/"

[tasks.check-packages]
cmd = "nu naga/tasks/check-packages.nu"
description = "Unit checks of the sliced package set: partition, contents, dependencies, linking, activation, bare toolchain, export round trip, name collisions"

# [dev] pulls the core's build and host closure without building the package.
[feature.dev.dev]
naga-acpp-core = { path = "packages/core" }

[feature.dev.dependencies]
nushell = ">=0.106"
git = "*"
ripgrep = "*"
fd-find = "*"
gdb = "*"
rattler-build = ">=0.72"

# sg graph toolchain tests: the separate source package naga/sg-tests, built
# against the naga-acpp packages, plus lit for the compile-fail suite.
[feature.sg-tests.dependencies]
naga-sg-tests = { workspace = true }
lit = "*"
nushell = ">=0.106"

[feature.sg-tests.tasks.sg-test-host]
cmd = "nu naga/tasks/sg-test-run.nu host"
description = "sg: host-pure unit tests"

[feature.sg-tests.tasks.sg-test-omp]
cmd = "nu naga/tasks/sg-test-run.nu omp"
description = "sg: device tests, OpenMP"

[feature.sg-tests.tasks.sg-test-cuda]
cmd = "nu naga/tasks/sg-test-run.nu cuda"
description = "sg: device tests, omp;cuda"

[feature.sg-tests.tasks.sg-test-ocl]
cmd = "nu naga/tasks/sg-test-run.nu ocl"
description = "sg: device tests, OpenCL"

[feature.sg-tests.tasks.sg-test-ze]
cmd = "nu naga/tasks/sg-test-run.nu ze"
description = "sg: device tests, Level Zero"

[feature.sg-tests.tasks.sg-test-lit]
cmd = "nu naga/tasks/sg-test-run.nu lit"
description = "sg: lit compile-fail and compile-pass suite"

[feature.sg-tests.tasks.sg-jit-measure]
cmd = "nu naga/tasks/sg-jit-measure.nu"
description = "sg: cold before/after measurement of sg_jit_bench over backends and cases"

[feature.sg-tests.tasks.sg-jit-report]
cmd = "nu naga/tasks/sg-jit-report.nu"
description = "sg: render the before/after comparison of two sg-jit-measure runs"

[feature.sg-tests.tasks.sg-jit-lib-test]
cmd = "nu naga/tasks/tests/sg-jit-lib.test.nu"
description = "sg: unit tests of the measurement library"

[feature.sg-tests.tasks.sg-test]
cmd = "nu naga/tasks/sg-test-run.nu all"
description = "sg: every cell, no stop at first failure; logs under ~/logs/acpp-fork/sg-tests-<timestamp>/"

# Scratch environments of check-packages: the activation alone, and the bare toolchain alone.
[feature.check-activation.dependencies]
naga-acpp-clangxx_linux-64 = { workspace = true }

[feature.check-bare.dependencies]
naga-acpp-toolchain = { path = "." }

[feature.check-llvm-dev.dependencies]
naga-acpp-llvm-dev = { workspace = true }
cmake = ">=3.24"
ninja = "*"

[feature.check-consumer.dependencies]
naga-acpp-check-consumer = { workspace = true }

[feature.git.dependencies]
git = "*"
nushell = "*"

[feature.git.tasks]
setup-git = "git config core.hooksPath .project/hooks"

[environments]
dev = { features = ["dev"], no-default-feature = true }
git = { features = ["git"], no-default-feature = true }
sg-tests = { features = ["sg-tests"] }
check-activation = { features = ["check-activation"], no-default-feature = true }
check-bare = { features = ["check-bare"], no-default-feature = true }
check-consumer = { features = ["check-consumer"], no-default-feature = true }
check-llvm-dev = { features = ["check-llvm-dev"], no-default-feature = true }
