# Source pins for the core build: one table per tree build-stage expects under its
# source dir. fetch-sources.nu fetches and patches a tree once, and again only
# when its url, sha256 or patch set changes. Reference: acpp-toolchain
# recipe.yaml, staging output `source` (linux-64).
#
# `patches` are files under packages/core/patches/, applied in order with -p1.
# No sha256 on llvm-project: GitHub commit archives are not byte-stable; the URL
# pins the commit and a bad download fails to extract.

[llvm-project]
url = "https://github.com/ROCm/llvm-project/archive/0bace1908348b840e6aa1b4b6e12151dae208158.tar.gz"
patches = [
  "0012-llvm23-dllexport-double-annotation.patch",
  "0013-llvm23-ompkinds-undef-helper-macros.patch",
  "0014-llvm23-instrumentor-include-vfs.patch",
  "0015-compiler-rt-eprintf-dont-define.patch",
  "0016-llvm23-amd-missing-llvm-abi.patch",
  "0017-compiler-rt-profile-wshadow.patch",
  "0018-llvm23-libllvm-comgr-libstdcxx-compat.patch",
  "0019-llvm23-openmp-ftn-upper-memspace.patch",
  "0020-SLP-limit-second-pass-to-register-VF.patch",
]

[OpenCL-Headers]
