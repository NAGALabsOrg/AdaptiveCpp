# naga-acpp-runtime-level-zero: the Level Zero backend plugin. The GPU driver itself is the system's.
[package]
name = "naga-acpp-runtime-level-zero"
version = "0.dev0"
description = "acpp SYCL runtime with Level Zero backend dependencies (Intel GPUs)"
homepage = "https://github.com/NAGALabsOrg/AdaptiveCpp"
license = "BSD-3-Clause"
publish = true

[package.build]
backend = { name = "pixi-build-naga", version = "*" }

[package.build.config]
compilers = ["c", "cxx"]

[package.build.config.slice]
from = "naga-acpp-core"
include = ["lib/hipSYCL/librt-backend-ze*"]

[package.run-constraints]
acpp-runtime-level-zero = "<0.0a0"
acpp-runtime-level-zero-nightly = "<0.0a0"

[package.build-dependencies]
x86_64-microarch-level = "==3"

[package.host-dependencies]
naga-acpp-core = { workspace = true }
naga-acpp-llvm = { workspace = true }
# level-zero-devel exports `level-zero >=1.29.0,<2` (level-zero itself exports nothing)
level-zero-devel = "*"

[package.run-dependencies]
naga-acpp-runtime = { path = "../../slices/runtime", version = "==0.dev0" }
